broker:
  provider: alpaca
  environment: paper
  paper: true


market:
  provider: alpaca
  symbols:  [TQQQ, SQQQ]
  timeframe: 5Min

indicators:
  - type: atr
    parameters:
      period: 14

strategy:
  type: rules

  parameters:
    period: 14
    multiplier: 1.0

  buy:
    all:
      - left: close
        op: ">"
        right:
          expression: "previous_high + ATR * multiplier"

  sell:
    all:
      - left: close
        op: "<"
        right:
          expression: "previous_low - ATR * multiplier"

optimize:
  period:
    start: 5
    stop: 20
    step: 1

  multiplier:
    start: 1
    stop: 3
    step: 1

risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2
  take_profit: 4

schedule:
  interval: 60