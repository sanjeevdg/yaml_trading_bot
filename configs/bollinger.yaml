broker:
  provider: alpaca
  environment: paper
  paper: true


market:
  provider: alpaca
  symbols: [UBER, NOW]
  timeframe: 5Min


indicators:

  - type: bollinger
    parameters:
      period: 20
      stddev: 2


strategy:
  type: rules

  parameters:
    period: 20
    stddev: 2

  signals:

    BUY:
      all:

        - left: close
          op: "<="
          right: BB_LOWER

    SELL:
      all:

        - left: close
          op: ">="
          right: BB_UPPER


optimize:

  period:
    start: 10
    stop: 40
    step: 2

  stddev:
    start: 1
    stop: 3
    step: 1


risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2
  take_profit: 4


schedule:
  interval: 60