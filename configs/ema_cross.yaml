broker:
  provider: alpaca
  paper: true

market:
  provider: alpaca
  symbols:
    - AAPL
  timeframe: 5Min

indicators:
  - type: EMA
    parameters:
      period: 10

  - type: EMA
    parameters:
      period: 20

  - type: RSI
    parameters:
      period: 14

strategy:
  type: ema_cross

  parameters: {}

  optimize:
    fast:
      start: 5
      stop: 20
      step: 1

    slow:
      start: 20
      stop: 60
      step: 5


risk:
  position_size:
    type: fixed_cash
    amount: 1000
  stop_loss: 2
  take_profit: 5

schedule:
  interval: 60
