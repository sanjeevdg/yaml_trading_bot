broker:
  provider: alpaca
  environment: paper
  paper: true


market:
  provider: alpaca
  symbols: [UGI, DT]
  timeframe: 5Min


indicators:

  - type: EMA
    parameters:
      period: 10

  - type: EMA
    parameters:
      period: 20

  - type: RSI
    parameters:
      period: 14


strategy:
  type: rules

  parameters:
    fast: 10
    slow: 20

  signals:

    BUY:
      all:
        - left: EMA_{fast}
          op: crossover
          right: EMA_{slow}

    SELL:
      all:
        - left: EMA_{fast}
          op: crossunder
          right: EMA_{slow}


optimize:

  fast:
    start: 5
    stop: 20
    step: 1

  slow:
    start: 20
    stop: 60
    step: 5


risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2.0
  take_profit: 4.0


schedule:
  interval: 60