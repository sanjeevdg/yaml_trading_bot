broker:
  provider: alpaca
  paper: true

market:
  provider: alpaca
  symbols:
    - AAPL
  timeframe: 5Min

indicators:

  - type: ema
    parameters:
      period: 20

  - type: macd
    parameters:
      fast: 12
      slow: 26
      signal: 9

strategy:
  type: rules

  parameters:
    ema: 20
    fast: 12
    slow: 26
    signal: 9

  buy:
    all:

      - left: close
        op: ">"
        right: EMA_{ema}

      - left: MACD
        op: ">"
        right: MACD_SIGNAL

  sell:
    all:

      - left: close
        op: "<"
        right: EMA_{ema}

      - left: MACD
        op: "<"
        right: MACD_SIGNAL

optimize:

  ema:
    start: 10
    stop: 50
    step: 5

  fast:
    start: 8
    stop: 15
    step: 1

  slow:
    start: 20
    stop: 40
    step: 2

  signal:
    start: 5
    stop: 12
    step: 1

risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2
  take_profit: 5

schedule:
  interval: 60