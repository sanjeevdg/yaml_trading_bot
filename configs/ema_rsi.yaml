broker:
  provider: alpaca
  paper: true

market:
  provider: alpaca
  symbols:
    - AAPL
  timeframe: 5Min

indicators:

  - type: ema
    parameters:
      period: 20

  - type: rsi
    parameters:
      period: 14

strategy:
  type: rules

  parameters:
    ema: 20
    period: 14
    oversold: 35
    overbought: 65

  buy:
    all:
      - left: close
        op: ">"
        right: EMA_{ema}

      - left: RSI_{period}
        op: "<"
        right: oversold

  sell:
    all:
      - left: close
        op: "<"
        right: EMA_{ema}

      - left: RSI_{period}
        op: ">"
        right: overbought

optimize:

  ema:
    start: 10
    stop: 50
    step: 5

  period:
    start: 10
    stop: 20
    step: 2

  oversold:
    start: 20
    stop: 40
    step: 5

  overbought:
    start: 60
    stop: 80
    step: 5

risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2
  take_profit: 5

schedule:
  interval: 60