broker:
  provider: alpaca
  paper: true

market:
  provider: alpaca
  symbols: [TQQQ, SQQQ]   
  timeframe: 5Min

indicators:

  - type: macd
    parameters:
      fast: 12
      slow: 26
      signal: 9

strategy:
  type: rules

  parameters:
    fast: 12
    slow: 26
    signal: 9

  buy:
    all:

      - left: MACD
        op: crossover
        right: MACD_SIGNAL

  sell:
    all:

      - left: MACD
        op: crossunder
        right: MACD_SIGNAL

optimize:

  fast:
    start: 8
    stop: 15
    step: 1

  slow:
    start: 20
    stop: 40
    step: 2

  signal:
    start: 5
    stop: 12
    step: 1

risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2
  take_profit: 4

schedule:
  interval: 60