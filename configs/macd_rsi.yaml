broker:
  provider: alpaca
  paper: true

market:
  provider: alpaca
  symbols: [TQQQ, SQQQ]
  timeframe: 5Min

indicators:

  - type: macd
    parameters:
      fast: 12
      slow: 26
      signal: 9

  - type: rsi
    parameters:
      period: 14

strategy:
  type: rules

  parameters:
    fast: 12
    slow: 26
    signal: 9
    period: 14
    oversold: 35
    overbought: 65

  buy:
    all:

      - left: MACD
        op: ">"
        right: MACD_SIGNAL

      - left: RSI_{period}
        op: "<="
        right: oversold

  sell:
    all:

      - left: MACD
        op: "<"
        right: MACD_SIGNAL

      - left: RSI_{period}
        op: ">="
        right: overbought

optimize:

  fast:
    start: 8
    stop: 15
    step: 1

  slow:
    start: 20
    stop: 40
    step: 2

  signal:
    start: 5
    stop: 12
    step: 1

  period:
    start: 10
    stop: 20
    step: 2

  oversold:
    start: 20
    stop: 40
    step: 5

  overbought:
    start: 60
    stop: 80
    step: 5

risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2
  take_profit: 4

schedule:
  interval: 60