broker:
  provider: alpaca
  paper: true

market:
  provider: alpaca
  symbols:
    - AAPL
  timeframe: 5Min

indicators:

  - type: atr
    parameters:
      period: 10

  - type: supertrend
    parameters:
      period: 10
      multiplier: 3

strategy:
  type: rules

  parameters:
    period: 10
    multiplier: 3

  buy:
    all:

      - left: close
        op: ">"
        right: SUPERTREND

  sell:
    all:

      - left: close
        op: "<"
        right: SUPERTREND

optimize:

  period:
    start: 7
    stop: 20
    step: 1

  multiplier:
    start: 2
    stop: 5
    step: 1

risk:
  position_size:
    type: fixed_cash
    amount: 1000

  stop_loss: 2
  take_profit: 5

schedule:
  interval: 60